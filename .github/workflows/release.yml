name: Release

on:
  push:
    tags:
      - "v*"

# The built-in token is the only credential this workflow uses: it creates the
# GitHub release and uploads its assets.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The changelog is built from the commits since the previous tag.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: test
        run: go test -race -count=1 ./...

      - name: install syft (SBOMs)
        uses: anchore/sbom-action/download-syft@v0

      - name: release
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: attach Homebrew formula
        run: |
          make homebrew-formula VERSION="${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" dist/gta.rb --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
